<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGela - ონლაინ მაღაზია</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f4f4; display: flex; flex-direction: column; min-height: 100vh; }

        header {
            background: #232f3e;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .search-bar { flex-grow: 1; margin: 0 2rem; display: flex; }
        .search-bar input { width: 100%; padding: 10px; border: none; border-radius: 4px 0 0 4px; outline: none; }
        .search-bar button { padding: 8px 20px; background: #febd69; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .auth-box { display: flex; align-items: center; gap: 10px; }
        .user-name { font-weight: bold; color: #febd69; font-size: 14px; }
        
        .login-btn, .logout-btn {
            background: transparent;
            color: white;
            border: 1px solid #febd69;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            font-size: 14px;
        }
        .login-btn:hover, .logout-btn:hover { background: #febd69; color: #232f3e; }

        .cart-link { color: white; text-decoration: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; }

        .main-layout { display: flex; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; gap: 20px; }
        .sidebar { width: 260px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .sidebar h3 { margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .filter-group { margin-bottom: 20px; }
        .filter-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .filter-group select, .filter-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; outline: none; }

        .products-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card {
            background: white; padding: 20px; border-radius: 8px; display: flex;
            flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.3s;
            justify-content: space-between; height: 100%;
        }
        .product-card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; cursor: pointer; }
        .product-title { 
            color: #007185; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 15px; 
            height: 40px; 
            overflow: hidden; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            margin-bottom: 5px; 
            cursor: pointer;
        }
        .product-title:hover { color: #c45500; text-decoration: underline; }
        .price { font-size: 20px; font-weight: bold; color: #B12704; margin-bottom: 15px; }
        .add-btn { padding: 10px; border: none; background: #ffd814; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; }
        
        #cartCount { background: #e47911; color: white; padding: 2px 8px; border-radius: 50%; font-size: 14px; margin-left: 5px; }
    </style>
</head>
<body>

<header>
    <h2 style="cursor: pointer;" onclick="location.href='index_project.html'">MyGela</h2>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="მოძებნე დასახელებით...">
        <button onclick="applyFilters()">ძებნა</button>
    </div>
    <div class="nav-right">
        <div id="authSection" class="auth-box">
            <a href="login.html" class="login-btn">შესვლა</a>
        </div>
        <div class="cart-link" onclick="window.location.href='cart.html'">
            🛒 კალათა <span id="cartCount">0</span>
        </div>
    </div>
</header>

<div class="main-layout">
    <aside class="sidebar">
        <h3>ფილტრაცია</h3>
        <div class="filter-group">
            <label>კატეგორია</label>
            <select id="categoryFilter" onchange="applyFilters()">
                <option value="all">ყველა</option>
                <option value="phone">ტელეფონები</option>
                <option value="laptop">ნოუთბუქები</option>
            </select>
        </div>
        <div class="filter-group">
            <label>მაქს. ფასი: <span id="priceVal">5000</span> ₾</label>
            <input type="range" id="priceFilter" min="0" max="5000" step="100" value="5000" oninput="updatePriceLabel(this.value)">
        </div>
        <button onclick="location.reload()" style="width:100%; padding: 8px; cursor:pointer;">გასუფთავება</button>
    </aside>

    <main class="products-grid" id="productsContainer"></main>
</div>

<script>
    const container = document.getElementById("productsContainer");
    let allProducts = [];

    function checkAuth() {
        const authSection = document.getElementById("authSection");
        const userInfo = JSON.parse(localStorage.getItem("user_info"));
        if (userInfo) {
            authSection.innerHTML = `
                <span class="user-name">გამარჯობა, ${userInfo.firstName}</span>
                <button class="logout-btn" onclick="logout()">გამოსვლა</button>
            `;
        }
    }

    function logout() {
        localStorage.removeItem("user_info");
        location.reload();
    }

    const backupProducts = [
        { _id: "1", title: "iPhone 15 Pro", category: "phone", brand: "Apple", price: {current: 3200, currency: "₾"}, thumbnail: "https://m.media-amazon.com/images/I/81SigAnN7pL._AC_SL1500_.jpg" },
        { _id: "2", title: "Samsung Galaxy S24", category: "phone", brand: "Samsung", price: {current: 2800, currency: "₾"}, thumbnail: "https://m.media-amazon.com/images/I/71JL6mS9o1L.jpg" },
        { _id: "3", title: "MacBook Air M3", category: "laptop", brand: "Apple", price: {current: 4500, currency: "₾"}, thumbnail: "https://m.media-amazon.com/images/I/71ItM99uNML.jpg" },
        { _id: "4", title: "HP Victus Gaming", category: "laptop", brand: "HP", price: {current: 2200, currency: "₾"}, thumbnail: "https://m.media-amazon.com/images/I/71Vf68vSURL._AC_SL1500_.jpg" }
    ];

    async function loadProducts() {
        container.innerHTML = "<h3>იტვირთება...</h3>";
        try {
            const res = await fetch("https://api.everrest.educata.dev/shop/products/all?page_index=1&page_size=50");
            if (!res.ok) throw new Error();
            const result = await res.json();
            allProducts = result.products;
        } catch (e) {
            allProducts = backupProducts;
        }
        displayProducts(allProducts);
    }

    function displayProducts(products) {
        container.innerHTML = "";
        if(products.length === 0) {
            container.innerHTML = "<h3>პროდუქტები ვერ მოიძებნა</h3>";
            return;
        }
        products.forEach(p => {
            const card = document.createElement("div");
            card.className = "product-card";
            // ჩამატებულია window.location.href გადასასვლელად
            card.innerHTML = `
                <img src="${p.thumbnail}" 
                     onclick="window.location.href='product.html?id=${p._id}'"
                     onerror="this.src='https://via.placeholder.com/200x180?text=No+Image'">
                <div>
                    <a href="product.html?id=${p._id}" class="product-title">${p.title}</a>
                    <div class="price">${p.price.current} ${p.price.currency}</div>
                </div>
                <button class="add-btn" onclick="addToCart('${p._id}')">🛒 კალათაში დამატება</button>
            `;
            container.appendChild(card);
        });
    }

    function applyFilters() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const cat = document.getElementById("categoryFilter").value;
        const maxPrice = parseFloat(document.getElementById("priceFilter").value);

        const filtered = allProducts.filter(p => {
            const matchesSearch = p.title.toLowerCase().includes(search);
            const matchesPrice = p.price.current <= maxPrice;
            let matchesCat = (cat === "all") || (p.category === cat) || (p.category?.name?.toLowerCase().includes(cat));
            return matchesSearch && matchesPrice && matchesCat;
        });
        displayProducts(filtered);
    }

    function updatePriceLabel(val) {
        document.getElementById("priceVal").textContent = val;
        applyFilters();
    }

    function addToCart(id) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const product = allProducts.find(p => p._id === id);
        if (!product) return;
        
        const existing = cart.find(item => item.id === id);
        if (existing) { existing.qty++; } 
        else { cart.push({ id, qty: 1, title: product.title, price: product.price.current, image: product.thumbnail }); }
        
        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
        alert("დაემატა ✅");
    }

    function updateCartCount() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").textContent = cart.reduce((s, i) => s + i.qty, 0);
    }

    checkAuth();
    updateCartCount();
    loadProducts();
</script>
</body>
</html>
