<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>პროდუქტის დეტალები - MyGela</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; padding: 0; margin: 0; }
        
        /* ჰედერის სტილი */
        header {
            background: #232f3e;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .cart-link { color: white; text-decoration: none; font-size: 18px; }

        .container { padding: 40px; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007185; font-weight: bold; }
        
        .product-container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; display: flex; gap: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product-img img { width: 380px; height: 380px; border-radius: 8px; object-fit: contain; }
        
        .info { flex: 1; }
        .info h1 { margin: 0 0 10px 0; font-size: 24px; color: #111; }
        .brand { color: #555; font-size: 16px; margin-bottom: 5px; }
        .price { font-size: 30px; color: #B12704; font-weight: bold; margin: 15px 0; }
        
        .stock { font-weight: bold; margin-bottom: 20px; padding: 6px 12px; border-radius: 4px; display: inline-block; }
        .in-stock { background: #e7f4e7; color: #007600; }

        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .add-btn { background: #ffd814; flex: 2; border: 1px solid #fcd200; }
        .rate-btn { background: #e7e9ec; border: 1px solid #adb1b8; flex: 1; }

        /* ტაბები */
        .tabs { margin: 40px auto; max-width: 1000px; }
        .tab-headers { display: flex; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 12px 30px; cursor: pointer; border: none; background: none; font-size: 16px; font-weight: bold; color: #555; }
        .tab-btn.active { color: #e47911; border-bottom: 3px solid #e47911; }
        .tab-content { background: white; padding: 25px; border-radius: 0 0 8px 8px; display: none; }
        .tab-content.active { display: block; }

        /* მოდალი */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 380px; text-align: center; }
        .modal input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; }
        .stars-select { font-size: 35px; cursor: pointer; color: #ccc; }
        .stars-select span.active { color: #ffa41c; }
    </style>
</head>
<body>

    <header>
        <a href="index_project.html" class="logo">MyGela</a>
        <a href="cart.html" class="cart-link">🛒 კალათა</a>
    </header>

    <div class="container">
        <a href="index_project.html" class="back-link">← დაბრუნება მაღაზიაში</a>

        <div id="loading" style="text-align: center; font-size: 20px; margin-top: 50px;">იტვირთება...</div>

        <div id="mainContent" style="display: none;">
            <div class="product-container">
                <div class="product-img">
                    <img id="productImage" src="" alt="პროდუქტი">
                </div>
                <div class="info">
                    <h1 id="productTitle"></h1>
                    <div class="brand" id="productBrand"></div>
                    <div class="release-year" id="productYear"></div>
                    <div class="price" id="productPrice"></div>
                    <div id="stockStatus" class="stock"></div>
                    
                    <div class="actions">
                        <button class="btn add-btn" onclick="addToCart()">🛒 კალათაში დამატება</button>
                        <button class="btn rate-btn" onclick="openModal()">⭐ შეფასება</button>
                    </div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab-headers">
                    <button class="tab-btn active" onclick="showTab('details', this)">დეტალები</button>
                    <button class="tab-btn" onclick="showTab('reviews', this)">შეფასებები</button>
                </div>
                <div id="details" class="tab-content active">
                    <h3 style="margin-top:0;">აღწერა</h3>
                    <p id="fullDescription"></p>
                </div>
                <div id="reviews" class="tab-content">
                    <h3 style="margin-top:0;">მომხმარებელთა შეფასებები</h3>
                    <div id="reviewsList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="rateModal" class="modal">
        <div class="modal-content">
            <h3>დატოვეთ შეფასება</h3>
            <div class="stars-select" id="modalStars">
                <span onclick="setRating(1)">★</span><span onclick="setRating(2)">★</span><span onclick="setRating(3)">★</span><span onclick="setRating(4)">★</span><span onclick="setRating(5)">★</span>
            </div>
            <input type="text" id="reviewerName" placeholder="თქვენი სახელი">
            <button class="btn add-btn" style="width: 100%;" onclick="submitReview()">შენახვა</button>
            <button class="btn rate-btn" style="width: 100%; margin-top: 10px;" onclick="closeModal()">გაუქმება</button>
        </div>
    </div>

    <script>
        let currentProduct = null;
        let userRating = 0;

        async function initPage() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) return;

            try {
                const response = await fetch(`https://api.everrest.educata.dev/shop/products/id/${id}`);
                currentProduct = await response.json();

                document.getElementById("productImage").src = currentProduct.thumbnail;
                document.getElementById("productTitle").innerText = currentProduct.title;
                document.getElementById("productBrand").innerText = `ბრენდი: ${currentProduct.brand || 'General'}`;
                document.getElementById("productPrice").innerText = `${currentProduct.price.current} ${currentProduct.price.currency}`;
                document.getElementById("fullDescription").innerText = currentProduct.description;
                
                const stock = currentProduct.stock || 12;
                currentProduct.validStock = stock;
                document.getElementById("stockStatus").innerText = `მარაგშია: ${stock} ცალი`;
                document.getElementById("stockStatus").className = "stock in-stock";

                renderReviews();
                document.getElementById("loading").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } catch (e) {
                document.getElementById("loading").innerHTML = "<h2>შეცდომაა ❌</h2>";
            }
        }

        function showTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function openModal() { document.getElementById("rateModal").style.display = "flex"; }
        function closeModal() { document.getElementById("rateModal").style.display = "none"; }
        
        function setRating(r) {
            userRating = r;
            document.querySelectorAll("#modalStars span").forEach((s, i) => s.classList.toggle("active", i < r));
        }

        function addToCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const idx = cart.findIndex(i => i.id === currentProduct._id);
            if (idx > -1) { cart[idx].qty++; }
            else {
                cart.push({
                    id: currentProduct._id,
                    title: currentProduct.title,
                    price: currentProduct.price.current,
                    image: currentProduct.thumbnail,
                    stock: currentProduct.validStock,
                    qty: 1,
                    rating: 5
                });
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("დაემატა კალათაში! ✅");
        }

        function renderReviews() {
            const list = document.getElementById("reviewsList");
            const reviews = (JSON.parse(localStorage.getItem("mygela_reviews")) || {})[currentProduct._id] || [];
            list.innerHTML = reviews.length ? reviews.map(r => `
                <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
                    <b>${r.name}</b>
                    <div style="color: #ffa41c;">${"★".repeat(r.stars)}</div>
                    <p style="font-size: 12px; color: #777;">${r.date}</p>
                </div>
            `).join('') : "<p>შეფასებები არ არის.</p>";
        }

        function submitReview() {
            const name = document.getElementById("reviewerName").value.trim();
            if (!name || !userRating) return alert("შეავსეთ მონაცემები!");
            let all = JSON.parse(localStorage.getItem("mygela_reviews")) || {};
            if (!all[currentProduct._id]) all[currentProduct._id] = [];
            all[currentProduct._id].unshift({ name, stars: userRating, date: new Date().toLocaleDateString('ka-GE') });
            localStorage.setItem("mygela_reviews", JSON.stringify(all));
            closeModal();
            renderReviews();
        }

        initPage();
    </script>
</body>
</html>
